name: Build and verify iPhone demo
on:
  workflow_dispatch:
  push:
    branches: ["Om's-changes"]
permissions:
  contents: read
concurrency:
  group: ios-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.1.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Check source privacy
        run: python3 scripts/privacy_check.py
      - name: Test exact payment model
        run: swift test
      - name: Generate Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version
          python3 scripts/generate_icon.py
          xcodegen generate
      - name: Compile native application and test bundles
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project BankingHackathonDemo.xcodeproj -scheme BankingHackathonDemo -destination 'generic/platform=iOS Simulator' -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO > build-ui.log 2>&1 || { tail -n 120 build-ui.log; exit 1; }
      - name: Select matching iPhone simulator
        id: simulator
        run: python3 scripts/simulator.py
      - name: Prepare native keyboard and simulator
        timeout-minutes: 8
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl spawn "$SIMULATOR_ID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool YES
      - name: Capture account and transaction screens for visual review
        timeout-minutes: 2
        run: bash scripts/capture.sh account-details transactions
      - uses: actions/upload-artifact@v4
        with:
          name: Account-and-transaction-screens
          path: build/screenshots/
          retention-days: 3
          if-no-files-found: error
      - name: Build and test native main flow
        run: |
          set -o pipefail
          xcodebuild test-without-building -project BankingHackathonDemo.xcodeproj -scheme BankingHackathonDemo -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/Simulator -resultBundlePath build/UITests.xcresult CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO >> build-ui.log 2>&1 || { tail -n 160 build-ui.log; exit 1; }
          tail -n 25 build-ui.log
      - name: Export failure screenshots
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        run: xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/test-attachments
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: UI-diagnostics
          path: |
            build-ui.log
            build/test-attachments/
          retention-days: 3
      - name: Capture fictional demo screens
        timeout-minutes: 4
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        run: bash scripts/capture.sh
      - name: Build unsigned physical iPhone application
        run: |
          set -o pipefail
          xcodebuild build -project BankingHackathonDemo.xcodeproj -scheme BankingHackathonDemo -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/Device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' > build-device.log 2>&1 || { tail -n 120 build-device.log; exit 1; }
          tail -n 15 build-device.log
      - name: Package and independently verify device IPA
        run: |
          python3 scripts/package_ipa.py build/Device/Build/Products/Release-iphoneos/BankingHackathonDemo.app build/ChaseDemo-unsigned.ipa
          python3 scripts/verify_ipa.py build/ChaseDemo-unsigned.ipa build/build-verification.json
          xcrun lipo -archs build/Device/Build/Products/Release-iphoneos/BankingHackathonDemo.app/BankingHackathonDemo
          git rev-parse HEAD > build/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChaseDemo-unsigned
          path: |
            build/ChaseDemo-unsigned.ipa
            build/build-verification.json
            build/source-commit.txt
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Fictional-demo-visual-and-test-results
          path: |
            build/screenshots/
            build/UITests.xcresult/
            build-ui.log
            build-device.log
          retention-days: 3
