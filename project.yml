name: BankingHackathonDemo
options:
  bundleIdPrefix: io.hackathon.fictionalbank
  deploymentTarget:
    iOS: '17.0'
packages:
  DemoCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ''
targets:
  BankingHackathonDemo:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: DemoCore
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: io.hackathon.fictionalbank.chaselookalike
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: BankingHackathonDemo
        MARKETING_VERSION: '0.4.1'
        CURRENT_PROJECT_VERSION: '5'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chase Demo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  DemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BankingHackathonDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  DemoStateTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StateTests]
    dependencies:
      - target: BankingHackathonDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BankingHackathonDemo:
    build:
      targets:
        BankingHackathonDemo: all
        DemoUITests: [test]
        DemoStateTests: [test]
    test:
      targets: [DemoStateTests, DemoUITests]
